apiVersion: apps/v1
kind: Deployment
metadata:
  name: pweb-deployment
  labels:
    app: pweb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pweb
  template:
    metadata:
      labels:
        app: pweb
    spec:
      containers:
        - name: pweb
          image: ghcr.io/ryuzxy/pweb:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always
      imagePullSecrets:
        - name: ghcr-secret
